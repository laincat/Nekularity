# XcodeGen spec. Generate the project with `xcodegen generate` after
# scripts/fetch-core.sh has placed VeneraCatCore.xcframework in Vendor/.
name: Nekularity
options:
  bundleIdPrefix: com.laincat
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  NekularityKit:
    path: .
  # The player. Video decoders belong with the platform, not with Core: Core
  # answers where an episode plays, the engine plays it.
  # Exact, not `from:`: `from:` means up-to-next-major, and the same tree then
  # resolved 7.53.1 on one machine and could resolve another version on the
  # next. The player is what a build reproduces or does not.
  AetherEngine:
    url: https://github.com/superuser404notfound/AetherEngine.git
    exactVersion: 7.53.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Nekularity:
    type: application
    platform: iOS
    sources:
      - path: App
        # An Info.plist inside the sources is also copied as a resource, and Xcode
        # then fails the build with "contains this target's Info.plist".
        excludes:
          - Info.plist
      # Shared with the extension: one definition of what an activity carries, so the
      # app and the island cannot disagree about its shape.
      - path: Live
    dependencies:
      - package: NekularityKit
        product: NekularityKit
      - package: AetherEngine
        product: AetherEngine
      # The Live Activity lives in the extension; the app starts and updates it.
      - target: NekularityWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laincat.nekularity
        PRODUCT_NAME: Nekularity
        MARKETING_VERSION: "0.3.8"
        CURRENT_PROJECT_VERSION: "20"
        # An explicit Info.plist because ATS is a nested dictionary, and the
        # INFOPLIST_KEY_* settings only carry flat values.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        # The icon comes from the catalogue. Without this name the build succeeds and
        # the app has a blank icon, which is how a missing icon usually shows up.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # The Dynamic Island and the Lock Screen. An extension because ActivityKit requires
  # one; nothing here draws content of the app's own.
  NekularityWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - Info.plist
      - path: Live
    dependencies:
      - package: NekularityKit
        product: NekularityKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laincat.nekularity.widgets
        PRODUCT_NAME: NekularityWidgets
        MARKETING_VERSION: "0.3.8"
        CURRENT_PROJECT_VERSION: "20"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/Info.plist
        SKIP_INSTALL: YES

  # Drives the app on a simulator, because the Windows machine cannot draw an
  # interface and "the button works" was otherwise only checked by hand.
  NekularityUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        # These servers run on the host. Copying both into the flat test
        # bundle would give them the same serve.py output path.
        excludes:
          - Fixtures/theme/serve.py
          - Fixtures/standard-ai/serve.py
    dependencies:
      - target: Nekularity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laincat.nekularity.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Nekularity
schemes:
  Nekularity:
    build:
      targets:
        Nekularity: all
        NekularityUITests: [test]
    test:
      targets:
        - NekularityUITests
