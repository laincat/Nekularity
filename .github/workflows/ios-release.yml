name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      ui_tests:
        description: 'Run the interface suite on a simulator after building it'
        type: boolean
        default: false
      ui_only:
        description: 'Run only these interface cases (comma separated: XCUITestClass/testMethod)'
        type: string
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build pinned Core
        run: sh scripts/fetch-core.sh
      - name: Magpie loopback HTTP acceptance
        # Real HTTP against the pinned Core's public mobile API: model list,
        # refreshed credentials, first text before the body completes, the peer
        # closing on cancellation, a targeted release, Unicode and HTTP 503.
        # It needs no account or network and fails on any of the seven checks.
        run: python3 scripts/fixtures/magpie-http/run.py build/core
      - name: Check the tree before building it
        run: |
          # After the Core fetch on purpose: one of these checks compares the kit's
          # Core calls against Core's own sources, and run before the fetch it can
          # only report "no checkout" — which is what failed here the first time.
          # Each check names itself on failure; a chained step that aborts says
          # "something was wrong" and nothing else.
          fail=0
          run_check() {
            echo "=== $*"
            if ! "$@"; then
              echo "FAILED: $*"
              fail=1
            fi
          }
          # tree-sitter makes the parse check a real parse; without it the check
          # silently degrades to its regex rules and a green run means less than it
          # looks. Homebrew's python refuses a system install, so it goes in a venv —
          # and if even that fails the run says so instead of pretending.
          parse_python=python3
          if python3 -m venv "$RUNNER_TEMP/parse-venv" >/dev/null 2>&1 &&
             "$RUNNER_TEMP/parse-venv/bin/python" -m pip install --quiet --disable-pip-version-check                tree-sitter tree-sitter-swift; then
            parse_python="$RUNNER_TEMP/parse-venv/bin/python"
          else
            echo "NOTE: tree-sitter unavailable; the parse check will run its rules only"
          fi
          run_check sh scripts/check-docs.sh
          run_check sh scripts/check-partitions.sh
          run_check sh scripts/check-core-pin.sh
          run_check python3 scripts/check-kit-core-calls.py
          run_check python3 scripts/check-video-json.py
          run_check python3 scripts/check-magpie-event.py
          run_check "$parse_python" scripts/check-swift.py
          # Then prove the checks fire at all: each one built a rule that silently
          # matched nothing, and only a hand-made negative run showed it.
          run_check sh scripts/check-checks.sh
          exit $fail
      - name: Run the kit's unit tests
        # A hang here has cost ten minutes of a 90-minute job twice. Failing at
        # fifteen says so and keeps the log, which a cancelled run does not.
        timeout-minutes: 15
        run: |
          # The kit declares macOS alongside iOS so its tests run on the host the
          # build already happens on. Without this step a green run means "it
          # compiles", which is not the same as "the tests pass".
          # Streamed rather than redirected: a run that hits the timeout is killed
          # before any "print the log" step can run, which is why two hangs left a
          # log naming nothing at all.
          #
          # Serial because the whole suite takes about a second and holds Core
          # runtimes open. Several at once is the only thing the hangs had in common.
          set -o pipefail
          swift test --no-parallel --verbose 2>&1 | tee "$RUNNER_TEMP/swift-test.log"
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned device app
        run: |
          # The previous run ended mid-compile with no error line and no failing
          # command, which is what an out-of-memory kill looks like: the log simply
          # stops. Two jobs at a time and no index store cost minutes, not
          # correctness.
          vm_stat | head -4 || true
          df -h "$RUNNER_TEMP" | tail -1 || true
          xcodebuild -project Nekularity.xcodeproj -scheme Nekularity \
            -configuration Release -sdk iphoneos -jobs 2 -quiet \
            -derivedDataPath "$RUNNER_TEMP/nekularity-derived" \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO build
      - name: Compile the interface tests
        # The app scheme does not build UITests, so a case that does not compile is
        # only found on a Mac — which is where every interface mistake so far was
        # found. This compiles them and runs nothing.
        #
        # Signing stays on for this step and the run below, unlike the device
        # build: a simulator app with no signature has no Keychain, and the cases
        # that store a key failed with errSecMissingEntitlement (-34018) while
        # this was disabled. Ad-hoc signing on a simulator needs no team.
        run: |
          set -o pipefail
          xcodebuild -project Nekularity.xcodeproj -scheme Nekularity \
            -destination 'generic/platform=iOS Simulator' -jobs 2 -quiet \
            -derivedDataPath "$RUNNER_TEMP/nekularity-derived-ui" \
            -resultBundlePath "$RUNNER_TEMP/uitests-build.xcresult" \
            COMPILER_INDEX_STORE_ENABLE=NO build-for-testing \
            2>&1 | tee "$RUNNER_TEMP/uitests-build.log"
      - name: Keep interface build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nekularity-ui-build-diagnostics
          path: |
            ${{ runner.temp }}/uitests-build.log
            ${{ runner.temp }}/uitests-build.xcresult
            Nekularity.xcodeproj/project.pbxproj
          if-no-files-found: warn
      # Runs what the step above only compiled. Off by default so a release tag
      # stays fast; a dispatched run asks for it when a page's behaviour is the
      # question rather than a compile error. The sources are not seeded, so the
      # cases that need them skip themselves and say so in the log.
      - name: Start the standard-AI fixture
        # A UI test runs inside the simulator and cannot start a host process,
        # so the fixture the streaming cases need is started here. It listens on
        # loopback only and needs nothing but python3.
        if: inputs.ui_tests
        run: |
          mkdir -p "$RUNNER_TEMP/nk-ai-stream"
          python3 UITests/Fixtures/standard-ai/serve.py --port 18796             --log "$RUNNER_TEMP/nk-ai-stream/ai.jsonl" &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18796/events >/dev/null; then
              echo "standard-AI fixture is up"
              exit 0
            fi
            sleep 0.5
          done
          echo "the standard-AI fixture did not come up" >&2
          exit 1
      - name: Run the interface tests
        if: inputs.ui_tests
        run: |
          set -o pipefail
          device=$(xcrun simctl list devices available \
            | sed -n 's/^ *\(iPhone[^(]*\) (.*/\1/p' | head -1)
          if [ -z "$device" ]; then
            echo 'no iPhone simulator is available' >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "running on $device"
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          # The cases that need sources skip without them. The seed holds the
          # two fixtures that live in this repository (video_probe and
          # callback_probe), built by the desktop client's seedgen; the app is
          # installed first because the container only exists afterwards.
          app="$RUNNER_TEMP/nekularity-derived-ui/Build/Products/Debug-iphonesimulator/Nekularity.app"
          if [ -d "$app" ]; then
            xcrun simctl install "$device" "$app"
            sh scripts/check-seed.sh UITests/Fixtures/seed/plugins.json UITests/Fixtures/callback_probe.js
            sh scripts/seed-simulator.sh UITests/Fixtures/seed/plugins.json com.laincat.nekularity booted --replace
          else
            echo "no simulator build at $app; seeded cases will skip" >&2
          fi
          # The three theme-link cases need a local HTTPS fixture with a CA
          # trusted in THIS simulator. The script makes a throwaway CA, trusts
          # it in the simulator only, and leaves two loopback listeners up;
          # without it those cases skip in 0.1 s. Start it only when the theme
          # cases are in scope, so a targeted run does not pay for it.
          theme_pid=""
          if [ -z "${{ inputs.ui_only }}" ] || echo "${{ inputs.ui_only }}" | grep -q "ZZThemeLinkTests"; then
            NK_SERVE_ONLY=1 NK_PID_FILE="$RUNNER_TEMP/theme-fixture.pid" \
              sh scripts/theme-fixture.sh booted >"$RUNNER_TEMP/theme-fixture.log" 2>&1 &
            theme_pid=$!
            ready=0
            for i in $(seq 1 60); do
              if grep -q "theme-fixture: ready" "$RUNNER_TEMP/theme-fixture.log" 2>/dev/null; then
                ready=1
                break
              fi
              kill -0 "$theme_pid" 2>/dev/null || break
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              cat "$RUNNER_TEMP/theme-fixture.log" >&2
              echo "the theme fixture did not come up" >&2
              exit 1
            fi
            cat "$RUNNER_TEMP/theme-fixture.log"
          fi
          # Only the cases asked for, when some were. Not quiet: an assertion
          # message is the whole point of a run that fails.
          only=""
          for name in $(echo "${{ inputs.ui_only }}" | tr ',' ' '); do
            only="$only -only-testing:NekularityUITests/$name"
          done
          xcodebuild -project Nekularity.xcodeproj -scheme Nekularity \
            -destination "platform=iOS Simulator,name=$device" -jobs 2 \
            -derivedDataPath "$RUNNER_TEMP/nekularity-derived-ui" \
            -resultBundlePath "$RUNNER_TEMP/uitests-run.xcresult" \
            COMPILER_INDEX_STORE_ENABLE=NO test-without-building $only \
            2>&1 | tee "$RUNNER_TEMP/uitests-run.log"
          status=$?
          if [ -f "$RUNNER_TEMP/theme-fixture.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/theme-fixture.pid")" 2>/dev/null || true
            rm -f "$RUNNER_TEMP/theme-fixture.pid"
          fi
          [ -n "$theme_pid" ] && kill "$theme_pid" 2>/dev/null || true
          exit $status
      - name: Collect the app's engine log
        if: always() && inputs.ui_tests
        run: |
          # Written only when a case launches the app with NK_VIDEO_DIAGNOSTIC=1.
          data=$(xcrun simctl get_app_container booted com.laincat.nekularity data 2>/dev/null || true)
          if [ -n "$data" ] && [ -f "$data/Documents/engine.log" ]; then
            cp "$data/Documents/engine.log" "$RUNNER_TEMP/engine.log"
            echo "engine.log: $(wc -l <"$RUNNER_TEMP/engine.log") lines"
            grep -E "AE#154|legible|subtitle|#316" "$RUNNER_TEMP/engine.log" | head -40 || true
          else
            echo "no engine.log in the app container"
          fi
      - name: Keep interface run diagnostics
        if: always() && inputs.ui_tests
        uses: actions/upload-artifact@v4
        with:
          name: Nekularity-ui-run-diagnostics
          path: |
            ${{ runner.temp }}/uitests-run.log
            ${{ runner.temp }}/engine.log
            ${{ runner.temp }}/uitests-run.xcresult
            ${{ runner.temp }}/nk-ai-stream/ai.jsonl
            ${{ runner.temp }}/nk-ai-stream/ai.jsonl.requests.jsonl
          if-no-files-found: warn
      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$RUNNER_TEMP/nekularity-derived/Build/Products/Release-iphoneos/Nekularity.app" "$RUNNER_TEMP/package/Payload/"
          cd "$RUNNER_TEMP/package"
          zip -qry "$GITHUB_WORKSPACE/Nekularity.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Nekularity-unsigned-ipa
          path: Nekularity.ipa
          if-no-files-found: error
      - name: Publish IPA on a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Nekularity.ipa --generate-notes
