name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build pinned Core
        run: sh scripts/fetch-core.sh
      - name: Check the tree before building it
        run: |
          # After the Core fetch on purpose: one of these checks compares the kit's
          # Core calls against Core's own sources, and run before the fetch it can
          # only report "no checkout" — which is what failed here the first time.
          # Each check names itself on failure; a chained step that aborts says
          # "something was wrong" and nothing else.
          fail=0
          run_check() {
            echo "=== $*"
            if ! "$@"; then
              echo "FAILED: $*"
              fail=1
            fi
          }
          # tree-sitter makes the parse check a real parse; without it the check
          # silently degrades to its regex rules and a green run means less than it
          # looks. Homebrew's python refuses a system install, so it goes in a venv —
          # and if even that fails the run says so instead of pretending.
          parse_python=python3
          if python3 -m venv "$RUNNER_TEMP/parse-venv" >/dev/null 2>&1 &&
             "$RUNNER_TEMP/parse-venv/bin/python" -m pip install --quiet --disable-pip-version-check                tree-sitter tree-sitter-swift; then
            parse_python="$RUNNER_TEMP/parse-venv/bin/python"
          else
            echo "NOTE: tree-sitter unavailable; the parse check will run its rules only"
          fi
          run_check sh scripts/check-docs.sh
          run_check sh scripts/check-partitions.sh
          run_check sh scripts/check-core-pin.sh
          run_check python3 scripts/check-kit-core-calls.py
          run_check python3 scripts/check-video-json.py
          run_check python3 scripts/check-magpie-event.py
          run_check "$parse_python" scripts/check-swift.py
          # Then prove the checks fire at all: each one built a rule that silently
          # matched nothing, and only a hand-made negative run showed it.
          run_check sh scripts/check-checks.sh
          exit $fail
      - name: Run the kit's unit tests
        # A hang here has cost ten minutes of a 90-minute job twice. Failing at
        # fifteen says so and keeps the log, which a cancelled run does not.
        timeout-minutes: 15
        run: |
          # The kit declares macOS alongside iOS so its tests run on the host the
          # build already happens on. Without this step a green run means "it
          # compiles", which is not the same as "the tests pass".
          if ! swift test > "$RUNNER_TEMP/swift-test.log" 2>&1; then
            grep -E "error:|XCTAssert|failed" "$RUNNER_TEMP/swift-test.log" | head -40 || true
            tail -25 "$RUNNER_TEMP/swift-test.log"
            exit 1
          fi
          grep -E "Executed [0-9]+ test" "$RUNNER_TEMP/swift-test.log" | tail -1
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned device app
        run: |
          # The previous run ended mid-compile with no error line and no failing
          # command, which is what an out-of-memory kill looks like: the log simply
          # stops. Two jobs at a time and no index store cost minutes, not
          # correctness.
          vm_stat | head -4 || true
          df -h "$RUNNER_TEMP" | tail -1 || true
          xcodebuild -project Nekularity.xcodeproj -scheme Nekularity \
            -configuration Release -sdk iphoneos -jobs 2 -quiet \
            -derivedDataPath "$RUNNER_TEMP/nekularity-derived" \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$RUNNER_TEMP/nekularity-derived/Build/Products/Release-iphoneos/Nekularity.app" "$RUNNER_TEMP/package/Payload/"
          cd "$RUNNER_TEMP/package"
          zip -qry "$GITHUB_WORKSPACE/Nekularity.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Nekularity-unsigned-ipa
          path: Nekularity.ipa
          if-no-files-found: error
      - name: Publish IPA on a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Nekularity.ipa --generate-notes
