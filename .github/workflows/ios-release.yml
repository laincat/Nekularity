name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build pinned Core
        run: sh scripts/fetch-core.sh
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned device app
        run: |
          xcodebuild -project Nekularity.xcodeproj -scheme Nekularity \
            -configuration Release -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/nekularity-derived" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$RUNNER_TEMP/nekularity-derived/Build/Products/Release-iphoneos/Nekularity.app" "$RUNNER_TEMP/package/Payload/"
          cd "$RUNNER_TEMP/package"
          zip -qry "$GITHUB_WORKSPACE/Nekularity.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Nekularity-unsigned-ipa
          path: Nekularity.ipa
          if-no-files-found: error
      - name: Publish IPA on a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Nekularity.ipa --generate-notes
